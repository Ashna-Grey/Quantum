services:
  - type: web
    name: pauliguard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LEDGER_DB_PATH
        value: /opt/render/project/src/data/ledger.db
